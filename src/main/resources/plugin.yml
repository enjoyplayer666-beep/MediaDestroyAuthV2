name: MediaDestroyAuth
version: '1.0.0'
main: ru.mediadestroy.auth.MediaDestroyAuth
api-version: '1.21'
author: loserwrld
description: Авторизация/регистрация для сервера MediaDestroy

commands:
  l:
    description: Регистрация или вход по паролю
    usage: /l <пароль>
    aliases: [login, log, reg, register]
  changepassword:
    description: Смена пароля
    usage: /changepassword <старый пароль> <новый пароль>
    aliases: [changepass, cp]
  mdauth:
    description: Служебные команды MediaDestroyAuth
    usage: /mdauth reload | /mdauth reset <ник>
    permission: mediadestroyauth.admin
    permission-message: Недостаточно прав.

permissions:
  mediadestroyauth.admin:
    default: op
