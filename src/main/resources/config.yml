# ============================================
#  MediaDestroyAuth — конфигурация
#  Цветовые коды — стандартные Minecraft (&).
#  Строки с <gradient:...> — MiniMessage. Тег <center> в начале строки
#  (только в chat-welcome-*) центрирует строку в чате — обрабатывается кодом плагина.
# ============================================

server-name: "MediaDestroy"

timing:
  # Общее время на авторизацию/регистрацию (секунды) — боссбар сверху
  auth-timeout-seconds: 120
  # Как часто меняются местами экран 1 и экран 2 (секунды)
  cycle-interval-seconds: 5
  # Сколько показывается экран "Проверка пароля..." (тики, 20 = 1 сек)
  checking-title-ticks: 30
  # Сколько минут после входа сессия не требует повторного пароля
  session-duration-minutes: 60

# Боссбар (верхняя полоска с таймером)
bossbar:
  color: YELLOW
  style: SOLID
  # {time} — оставшиеся секунды, {cmd} — команда входа
  text: "&c[!] &fВведите пароль: &6/l пароль &7({time}s)"

# --- Экран 1 ---
screen-command:
  title: "&6&lВведите пароль"
  subtitle: "&fВведите команду &6/l пароль"

# --- Экран 2 ---
screen-chat:
  title: "&6&lИли просто"
  subtitle: "&fнапишите пароль в чат"

# --- Экран 3 (появляется сразу после ввода пароля) ---
screen-checking:
  # поддерживает MiniMessage-градиент
  title: "<gradient:yellow:gold><b>Проверка пароля...</b></gradient>"
  subtitle: "&7Подождите немного..."

# --- Экран после успешного входа БЕЗ пароля (сессия ещё активна, до 1 часа) ---
screen-welcome-back:
  title: "&a&lС возвращением!"
  subtitle: "&aВаша сессия сохранена!"

# Сообщение об ошибке при неверном пароле
wrong-password-message: "&c&l[!] &cНеверный пароль! Попробуйте ещё раз."

# Сообщение при регистрации (первый пароль игрока принят)
registered-message: "&a&l[✓] &aВы успешно зарегистрированы!"

# Кик по истечении времени
kick-message: "&c&lВремя авторизации истекло!\n&7Зайдите заново и введите пароль."

# ============================================
# Приветственные сообщения в чат
# ============================================

# Отправляется, только когда игрок реально ввёл пароль
# (обычный логин командой/чатом ИЛИ первая регистрация).
# <center> в начале строки — центрирует её в чате.
chat-welcome-login:
  - "<center><gradient:yellow:gold><b>MediaDestroy</b></gradient>"
  - "<center>&fДобро пожаловать на сервер!"
  - "<center>&fГруппа Вконтакте: &evk.com/mediadestroy"
  - "<center>&fОнлайн магазин: &emediadestroy.ru"
  - "<center>&fНаш ТГ канал: &et.me/mediadestroy"
  - ""
  - "<center>&c&l[!] &cВаш аккаунт уязвим!"
  - "<center>&eПривяжите его, чтобы избежать взлома!"
  - "<center>&eНажмите &eсюда для просмотра вариантов (&f/link&e)."

# Отправляется, когда игрок зашёл БЕЗ пароля по активной сессии
# (пароль не запрашивался — предупреждение про уязвимость не показываем).
chat-welcome-session:
  - "<center><gradient:yellow:gold><b>MediaDestroy</b></gradient>"
  - "<center>&fДобро пожаловать на сервер!"
  - "<center>&fГруппа Вконтакте: &evk.com/mediadestroy"
  - "<center>&fОнлайн магазин: &emediadestroy.ru"
  - "<center>&fНаш ТГ канал: &et.me/mediadestroy"
