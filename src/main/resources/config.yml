# ============================================
#  MediaDestroyAuth — конфигурация
#  Цветовые коды — стандартные Minecraft (&).
#  Строки с <...> — MiniMessage. Тег <center> в начале строки
#  (только в welcome.*) центрирует строку в чате — обрабатывается кодом плагина.
# ============================================

server-name: "MediaDestroy"

timing:
  # Общее время на авторизацию/регистрацию (секунды) — боссбар сверху
  auth-timeout-seconds: 120
  # Как часто меняются местами экран 1 и экран 2 (секунды)
  cycle-interval-seconds: 5
  # Сколько показывается экран "Проверка пароля..." (тики, 20 = 1 сек)
  checking-title-ticks: 30
  # Сколько минут после входа сессия не требует повторного пароля
  session-duration-minutes: 60

# Боссбар (верхняя полоска с таймером)
bossbar:
  color: YELLOW
  style: SOLID
  # {time} — оставшиеся секунды
  text: "&c[!] &fВведите пароль: &6/l пароль &7({time}s)"
  # для тех, кто ещё ни разу не заходил
  text-register: "&c[!] &fПридумайте пароль: &6/reg пароль &7({time}s)"
  # после первого ввода при регистрации
  text-confirm: "&c[!] &fПовторите пароль ещё раз &7({time}s)"

# --- Экран 1 (вход) ---
screen-command:
  title: "&6&lВведите пароль"
  subtitle: "&fВведите команду &6/l пароль"

# --- Экран 2 (вход) ---
screen-chat:
  title: "&6&lИли просто"
  subtitle: "&fнапишите пароль в чат"

# --- Регистрация: для тех, кто ещё ни разу не заходил на сервер ---
screen-register-command:
  title: "&6&lРегистрация"
  subtitle: "&fПридумайте пароль: &6/reg пароль"
screen-register-chat:
  title: "&6&lИли просто"
  subtitle: "&fнапишите новый пароль в чат"
# после первого ввода - повтор пароля
screen-register-confirm:
  title: "&6&lПовторите пароль"
  subtitle: "&fнапишите его ещё раз в чат или &6/reg пароль"

register:
  # спрашивать пароль второй раз (защита от опечатки)
  confirm-password: false
  min-length: 4
  max-length: 32
  bad-length-message: "&c&l[!] &cПароль должен быть от {min} до {max} символов."
  mismatch-message: "&c&l[!] &cПароли не совпадают! Придумайте пароль заново."

# Смена пароля: /changepassword <старый> <новый> (/changepass, /cp)
change-password:
  usage-message: "&cИспользование: &6/changepassword <старый пароль> <новый пароль>"
  wrong-old-message: "&c&l[!] &cСтарый пароль введён неверно."
  same-message: "&c&l[!] &cНовый пароль совпадает со старым."
  not-registered-message: "&c&l[!] &cВы ещё не зарегистрированы."
  success-message: "&a&l[✓] &aПароль успешно изменён!"

# --- Экран 3 (появляется сразу после ввода пароля) ---
screen-checking:
  # поддерживает MiniMessage-градиент
  title: "<gradient:yellow:gold><b>Проверка пароля...</b></gradient>"
  subtitle: "&7Подождите немного..."

# --- Экран после успешного входа БЕЗ пароля (сессия ещё активна, до 1 часа) ---
screen-welcome-back:
  title: "&a&lС возвращением!"
  subtitle: "&aВаша сессия сохранена!"

# Сообщение об ошибке при неверном пароле
wrong-password-message: "&c&l[!] &cНеверный пароль! Попробуйте ещё раз."

# Сообщение при регистрации (первый пароль игрока принят)
registered-message: "&a&l[✓] &aВы успешно зарегистрированы!"

# Кик по истечении времени
kick-message: "&c&lВремя авторизации истекло!\n&7Зайдите заново и введите пароль."

# ============================================
# Приветственные сообщения в чат
# ============================================

# <center> в начале строки — центрирует её в чате.
# Строки с <...> - MiniMessage: <u> - подчёркнуто, <click:run_command:/link> - команда по клику,
# <click:open_url:https://...> - ссылка.
welcome:
  # после РЕГИСТРАЦИИ (первый заход на сервер) - полностью, с предупреждением
  register:
    - ""
    - "<center><#FFBB6B>DestroyCraft"
    - "<center><gray>Добро пожаловать на сервер!"
    - "<center><gray>Группа Вконтакте: <click:open_url:https://vk.com/game_ds><#FFBB6B>vk.com/game_ds</click>"
    - "<center><gray>Онлайн магазин: <click:open_url:https://ds-craft.ru><#FFBB6B>ds-craft.ru</click>"
    - "<center><gray>Наш ТГ канал: <click:open_url:https://t.me/dscraft><#FFBB6B>t.me/dscraft</click>"
    - ""
    - "<#FF9966>⚠ <#FFA83B><u>Ваш аккаунт уязвим!</u>"
    - "<#FF9966>Привяжите его, чтобы избежать взлома!"
    - "<#FF9966>Нажмите <click:run_command:/link><hover:show_text:'<gray>Посмотреть варианты'><u>сюда</u></hover></click> для просмотра вариантов (/link)."
  # при обычном входе по паролю и по сессии - только верхний блок
  login:
    - ""
    - "<center><#FFBB6B>DestroyCraft"
    - "<center><gray>Добро пожаловать на сервер!"
    - "<center><gray>Группа Вконтакте: <click:open_url:https://vk.com/game_ds><#FFBB6B>vk.com/game_ds</click>"
    - "<center><gray>Онлайн магазин: <click:open_url:https://ds-craft.ru><#FFBB6B>ds-craft.ru</click>"
    - "<center><gray>Наш ТГ канал: <click:open_url:https://t.me/dscraft><#FFBB6B>t.me/dscraft</click>"
